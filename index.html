<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#5b3df5">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Clientes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Painel de Clientes</title>
<style>
html{font-size:18.5px;touch-action:pan-x pan-y}
:root{color-scheme:light dark;--bg:#f4f3fb;--card:#fff;--tx:#1c1b2e;--mut:#6b6a85;--pri:#5b3df5;--pri2:#ece9ff;--warn:#e8590c;--warn2:#ffeee0;--bd:#e1def2;--grad:linear-gradient(135deg,#6a4cff,#c13fe0)}
@media(prefers-color-scheme:dark){:root{--bg:#0f0e1a;--card:#1a1930;--tx:#ecebff;--mut:#9a98c2;--pri:#a493ff;--pri2:#2b2552;--warn:#ffa45c;--warn2:#3d2a17;--bd:#2d2b4d}}
*{box-sizing:border-box;margin:0}
body{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--tx);padding:14px;padding-top:calc(14px + env(safe-area-inset-top,0px));padding-bottom:calc(24px + env(safe-area-inset-bottom,0px));-webkit-text-size-adjust:100%;max-width:760px;margin:auto;line-height:1.4}
header{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:14px}
h1{font-size:1.25rem}
.perfil{font-size:.72rem;background:var(--grad);color:#fff;padding:5px 12px;border-radius:99px;font-weight:600}
.resumo{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
.resumo div{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:10px}
.resumo small{color:var(--mut);font-size:.8rem;display:block}
.resumo b{font-size:1.05rem}
.resumo .pend b{color:var(--warn)}
.resumo .rec b{color:var(--pri)}
section.box{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:14px}
h2{font-size:1rem;margin-bottom:10px}
form{display:grid;grid-template-columns:1fr 1fr;gap:10px}
label{font-size:.85rem;color:var(--mut);display:flex;flex-direction:column;gap:4px}
.full{grid-column:1/-1}
.lab{font-size:.85rem;color:var(--mut);margin-bottom:4px}
input,select{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:10px;width:100%;min-width:0}
input:focus-visible,select:focus-visible,button:focus-visible{outline:2px solid var(--pri);outline-offset:1px}
.par{display:flex;gap:6px}
.par select{padding:10px 6px;min-width:0;flex:1}
.par.data select:first-child{flex:.55}
.info{grid-column:1/-1;font-size:.84rem;color:var(--mut)}
button{font:inherit;cursor:pointer;border-radius:8px;border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:10px 14px;touch-action:manipulation}
button.pri{background:var(--grad);border-color:transparent;color:#fff;font-weight:600}
.acoes{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.acoes button{flex:1}
.linha{display:grid;grid-template-columns:1fr 104px 40px;gap:6px;margin-bottom:6px}
.linha button{padding:0}
.linha button.x{color:var(--warn)}
button.add{width:100%;border-style:dashed;color:var(--pri);margin-top:2px}
.busca{margin-bottom:10px}
.item{background:var(--card);border:2px solid var(--pri);border-radius:16px;padding:14px;margin-bottom:28px;box-shadow:0 6px 18px rgba(91,61,245,.22);overflow:hidden}
.topo{display:flex;justify-content:space-between;align-items:center;gap:8px;background:var(--pri2);margin:-14px -14px 12px;padding:14px;border-bottom:3px solid var(--pri)}
.topo b{font-size:.98rem}
.tag{font-size:.8rem;padding:3px 8px;border-radius:99px;height:fit-content;white-space:nowrap}
.tag.ok{background:var(--pri2);color:var(--pri)}
.tag.pd{background:var(--warn2);color:var(--warn)}
.plabel{font-size:.85rem;color:var(--mut);margin:10px 0 2px}
.prod{display:flex;justify-content:space-between;align-items:center;gap:6px;flex-wrap:wrap;padding:6px 0;border-bottom:1px solid var(--bd);font-size:.95rem}
.prod .pn{flex:1;min-width:0}
.prod .pv{font-weight:600}
.prod button.x{padding:4px 8px;font-size:.78rem;color:var(--warn)}
.soma{display:flex;justify-content:space-between;padding:8px 0;font-size:.92rem;font-weight:700}
.dados{display:grid;grid-template-columns:1fr 1fr;gap:10px 12px;font-size:.92rem;margin:10px 0}
.dados small{color:var(--mut)}
.calc{background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:12px;margin:8px 0 12px;display:grid;gap:7px;font-size:.95rem}
.calc h3{font-size:.8rem;color:var(--mut);font-weight:600}
.calc .l{display:flex;justify-content:space-between;gap:8px}
.calc .l span{color:var(--mut)}
.calc .pago b{color:var(--pri)}
.calc .falta{border-top:1px solid var(--bd);padding-top:6px;font-size:1rem}
.calc .falta b{color:var(--warn)}
.calc .ok b{color:var(--pri)}
.barra{height:8px;background:var(--bd);border-radius:99px;overflow:hidden}
.barra i{display:block;height:100%;background:var(--grad)}
.lap{border:none;background:transparent;padding:3px 6px;font-size:.95rem;border-radius:6px;opacity:.75}
.lap:hover{background:var(--pri2);opacity:1}
.ed{display:flex;gap:4px;align-items:center;margin-top:2px;flex-wrap:wrap}
.ed input,.ed select{padding:6px 8px;font-size:16px;min-width:0;width:auto;flex:1}
.ed button{padding:6px 9px;font-size:.8rem}
.meses{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 8px}
.meses button{padding:8px 11px;font-size:.88rem}
.meses button.pg{background:var(--pri2);border-color:var(--pri);color:var(--pri);font-weight:600}
.meses button.sel{outline:2px solid var(--pri)}
.mm{display:flex;gap:12px;margin:4px 0 12px}
.mm button{flex:1;padding:14px 0;font-size:1.7rem;font-weight:700;line-height:1;color:#fff;border:none;border-radius:12px}
.mm button.menos{background:#e03131}
.mm button.mais{background:#1c6bff}
.pag{background:var(--bg);border:1px solid var(--pri);border-radius:10px;padding:10px;margin:4px 0 10px;display:grid;gap:8px}
.pag b{font-size:.88rem}
.pag input{font-size:16px}
.pagbt{display:flex;gap:6px;flex-wrap:wrap}
.pagbt button{padding:9px 10px;font-size:.88rem;flex:1;white-space:nowrap}
.p0{font-size:.9rem;margin-top:3px;display:flex;align-items:center;flex-wrap:wrap;gap:2px}
.p0.ok{color:var(--pri);font-weight:700}
.p0.no{color:var(--mut)}
.p0 .reg{padding:5px 10px;font-size:.85rem;margin-top:2px;color:var(--pri);border-color:var(--pri)}
.pgrow{display:flex;justify-content:space-between;align-items:center;gap:6px;padding:7px 0;border-bottom:1px solid var(--bd);font-size:.95rem}
.pgrow .ok{color:var(--pri);font-weight:600}
.faltas{font-size:.88rem;color:var(--warn);margin:6px 0 2px}
.rod{display:flex;justify-content:flex-end}
.rod button{padding:7px 11px;font-size:.85rem;color:var(--warn)}
.erro{display:none;position:fixed;top:0;left:0;right:0;z-index:99;background:#fdecea;color:#8a1c12;border:1px solid #e5a29b;padding:10px;font-size:.85rem}
.toast{display:none;position:fixed;left:14px;right:14px;bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:100;padding:13px 14px;border-radius:12px;font-size:.9rem;font-weight:600;color:#fff;background:#e03131;box-shadow:0 6px 18px rgba(0,0,0,.3);text-align:center}
.toast.ok{background:#2f9e44}
textarea{font:inherit;font-size:16px;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:10px;width:100%;min-height:120px}
.bk p{font-size:.84rem;color:var(--mut);margin-bottom:8px}
.vazio{text-align:center;color:var(--mut);padding:18px 0;font-size:.9rem}
.dir{display:flex;align-items:center;gap:8px}
.foto{width:46px;height:46px;border-radius:50%;padding:0;border:2px solid var(--pri);background:var(--pri2) center/cover no-repeat;font-size:1.3rem;flex:none;line-height:1}
.status{font-size:.8rem;color:var(--mut);margin:-6px 0 12px}
.status.bad{background:#fdecea;color:#8a1c12;border:1px solid #e5a29b;border-radius:8px;padding:8px 10px;font-weight:600}
</style>
</head>
<body>

<div id="erro" class="erro"></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<noscript><div class="erro" style="display:block">Este visualizador está com o JavaScript desligado, então o painel não funciona. Abra o arquivo em outro navegador (ex.: Chrome).</div></noscript>

<header>
  <h1>Painel de Clientes</h1>
  <div class="dir">
    <span class="perfil">Perfil administrador · v20</span>
    <button type="button" class="foto" id="foto" aria-label="Foto do perfil">👤</button>
    <input type="file" id="fotoArq" accept="image/*" hidden>
  </div>
</header>
<div id="status" class="status"></div>

<button class="pri" id="btnInstalar" type="button" hidden style="width:100%;margin-bottom:14px">📲 Instalar aplicativo</button>

<div class="resumo">
  <div><small>Clientes</small><b id="rCli">0</b></div>
  <div><small>Bruto vendido</small><b id="rTot">R$ 0,00</b></div>
  <div class="rec"><small>Recebido</small><b id="rRec">R$ 0,00</b></div>
  <div class="pend"><small>Falta receber</small><b id="rPen">R$ 0,00</b></div>
</div>

<div class="acoes">
  <button class="pri" id="btnBackup" type="button">Fazer backup</button>
  <button id="btnRestaurar" type="button">Restaurar backup</button>
  <input type="file" id="arq" accept=".json" hidden>
</div>

<section class="box bk" id="bkBox" hidden>
  <h2>Backup</h2>
  <p id="bkMsg"></p>
  <textarea id="bkTxt" spellcheck="false"></textarea>
  <div class="acoes" style="margin:10px 0 0">
    <button type="button" id="bkCopiar">Copiar texto</button>
    <button type="button" class="pri" id="bkRest">Restaurar deste texto</button>
    <button type="button" id="bkArqBtn">Abrir arquivo</button>
    <button type="button" id="bkFechar">Fechar</button>
  </div>
</section>

<section class="box">
  <h2>Cadastrar cliente</h2>
  <form id="f">
    <label class="full">Nome do cliente
      <input id="nome" required autocomplete="off">
    </label>
    <div class="full">
      <div class="lab">Produtos (nome e valor de cada um)</div>
      <div id="itensForm"></div>
      <button type="button" class="add" id="addLinha">+ Adicionar produto</button>
    </div>
    <label class="full">Dia da compra
      <span class="par data" id="compraBox"></span>
    </label>
    <label>Parcelas (vezes)
      <input id="vezes" type="number" min="1" max="60" step="1" value="1" inputmode="numeric" required>
    </label>
    <label>Mês da primeira parcela
      <span class="par" id="mesBox"></span>
    </label>
    <div class="info" id="previa">Adicione os produtos para ver a soma.</div>
    <button class="pri" type="submit" style="grid-column:1/-1">Salvar cliente</button>
  </form>
</section>

<section class="box">
  <h2>Clientes cadastrados</h2>
  <input class="busca" id="busca" placeholder="Buscar por cliente ou produto" type="search">
  <div id="lista"></div>
</section>

<script>
window.__ok=false;window.__err='';
function __mostra(t){var d=document.getElementById('erro');if(d){d.style.display='block';d.textContent=t;}}
window.onerror=function(m,u,l){
  window.__err=String(m);
  var t='Erro no script: '+m+' (linha '+l+').';
  if(/end of input|Unexpected end|Unterminated/i.test(String(m))){t+=' O arquivo parece estar incompleto (cortado). Baixe o arquivo pelo cartão e envie sem copiar e colar.';}
  __mostra(t);
};
setTimeout(function(){if(!window.__ok&&!window.__err){__mostra('O script do painel não executou. Se o arquivo veio de copiar e colar, ele pode estar cortado: baixe o arquivo pelo cartão e envie sem copiar e colar.');}},1500);
</script>
<script>
if (!Array.prototype.find) { Array.prototype.find = function (f) { for (var i = 0; i < this.length; i++) { if (f(this[i], i, this)) return this[i]; } return undefined; }; }
(function () {
  var KEY = 'painel_clientes_v1';
  var dados = [];
  var ed = null; // campo em edição: {id, key, idx}
  var pg = null; // pagamento em edição: {id, i}

  function $(id) { return document.getElementById(id); }
  function brl(n) { return n.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' }); }
  function dois(n) { return n < 10 ? '0' + n : '' + n; }
  function tem(a, v) { return a.indexOf(v) !== -1; }
  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (m) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m];
    });
  }
  var NOMES = ['jan', 'fev', 'mar', 'abr', 'mai', 'jun', 'jul', 'ago', 'set', 'out', 'nov', 'dez'];
  var MESES = ['Janeiro', 'Fevereiro', 'Março', 'Abril', 'Maio', 'Junho', 'Julho', 'Agosto', 'Setembro', 'Outubro', 'Novembro', 'Dezembro'];

  /* ---------- aviso na tela (alert() pode ser bloqueado em alguns navegadores/apps) ---------- */
  var toastT = null;
  function aviso(msg, ok) {
    var t = $('toast');
    t.textContent = msg;
    t.className = 'toast' + (ok ? ' ok' : '');
    t.style.display = 'block';
    if (toastT) clearTimeout(toastT);
    toastT = setTimeout(function () { t.style.display = 'none'; }, ok ? 2200 : 4500);
  }

  /* ---------- números: aceita 140,50 / 140.50 / 1.234,56 / R$ 140 ---------- */
  function num(s) {
    s = String(s == null ? '' : s).replace(/R\$|\s/g, '');
    if (!s) return NaN;
    if (s.indexOf(',') !== -1) { s = s.replace(/\./g, '').replace(',', '.'); }
    else if ((s.match(/\./g) || []).length > 1) { s = s.replace(/\./g, ''); }
    if (!/^(\d+(\.\d+)?|\.\d+)$/.test(s)) return NaN;
    return parseFloat(s);
  }
  function fnum(v) { return String(v).replace('.', ','); }
  function r2(n) { return Math.round(n * 100) / 100; }

  /* ---------- dados ----------
     Cada cliente: nome, itens[{nome,valor}], vezes, mes (AAAA-MM da 1ª parcela), compra (AAAA-MM-DD),
     pagas[] (índices das parcelas pagas), valores{i: valor pago}, datas{i: dia do pagamento} */
  function somaItens(itens) {
    var t = 0;
    for (var i = 0; i < itens.length; i++) { t += Number(itens[i].valor) || 0; }
    return t;
  }
  function normaliza(c) {
    if (!c.itens) {
      c.itens = [{ nome: c.produto || 'Produto', valor: (c.valor || 0) * (c.qtd || 1) }];
      delete c.produto; delete c.valor; delete c.qtd;
    }
    if (!c.vezes || c.vezes < 1) c.vezes = 1;
    if (c.pgs) {
      /* dados salvos pela v15-v17 (lista de pagamentos): cada pagamento vira uma parcela paga, em ordem */
      var l = c.pgs.slice().sort(function (a, b) { return a.data < b.data ? -1 : (a.data > b.data ? 1 : 0); });
      c.pagas = []; c.valores = {}; c.datas = {};
      if (l.length > c.vezes) c.vezes = l.length;
      l.forEach(function (p, k) {
        c.pagas.push(k); c.valores[k] = p.valor; c.datas[k] = p.data;
      });
      delete c.pgs;
    }
    if (!c.pagtos || typeof c.pagtos !== 'object') c.pagtos = {};
    /* dados de versões antigas (1 pagamento por parcela): cada parcela paga vira uma lista com 1 pagamento */
    if (Array.isArray(c.pagas)) {
      var tot = somaItens(c.itens);
      c.pagas.map(Number).forEach(function (i) {
        if (c.pagtos[i] && c.pagtos[i].length) return;
        var v = c.valores ? c.valores[i] : undefined;
        if (v === undefined || v === null || isNaN(Number(v))) v = r2(tot / c.vezes);
        c.pagtos[i] = [{ v: Number(v), d: (c.datas && c.datas[i]) || c.compra || hoje() }];
      });
    }
    delete c.pagas; delete c.valores; delete c.datas; delete c.manual;
    return c;
  }
  function achar(id) { return dados.find(function (x) { return x.id === id; }); }

  /* pagamentos de uma parcela: c.pagtos[i] = [{v: valor, d: dia}, ...] (pode ter vários no mesmo mês) */
  function pagos(c, i) { return (c.pagtos && c.pagtos[i]) || []; }
  function somaPag(c, i) {
    var t = 0, l = pagos(c, i);
    for (var k = 0; k < l.length; k++) { t += Number(l[k].v) || 0; }
    return r2(t);
  }
  function ultData(c, i) {
    var l = pagos(c, i), d = '';
    for (var k = 0; k < l.length; k++) { if (l[k].d > d) d = l[k].d; }
    return d || c.compra || hoje();
  }
  function resumoPag(c, i) {
    var l = pagos(c, i);
    return brl(somaPag(c, i)) + ' · ' + (l.length > 1 ? l.length + ' pgtos' : fmtCurto(ultData(c, i)));
  }

  function rotuloMes(ym, i) {
    var p = ym.split('-').map(Number);
    var d = new Date(p[0], p[1] - 1 + i, 1);
    return NOMES[d.getMonth()] + '/' + String(d.getFullYear()).slice(2);
  }
  function calc(c) {
    var total = somaItens(c.itens), n = c.vezes, pago = 0, pagas = 0, i;
    for (i = 0; i < n; i++) {
      if (pagos(c, i).length) { pagas++; pago += somaPag(c, i); }
    }
    pago = r2(pago);
    var pendente = Math.max(0, r2(total - pago));
    var faltam = n - pagas;
    var pct = total > 0 ? Math.min(100, pago / total * 100) : 0;
    return { total: total, parcela: total / n, pagas: pagas, pago: pago, pendente: pendente, faltam: faltam, pct: pct, resto: faltam > 0 ? pendente / faltam : 0 };
  }

  /* ---------- armazenamento: localStorage + cópia no IndexedDB ---------- */
  var FOTO = 'painel_foto_v1';
  var idb = null;
  function abrirIDB(cb) {
    var feito = false;
    function fim() { if (!feito) { feito = true; cb(); } }
    try {
      var rq = indexedDB.open('painel_clientes', 1);
      rq.onupgradeneeded = function () { rq.result.createObjectStore('kv'); };
      rq.onsuccess = function () { idb = rq.result; fim(); };
      rq.onerror = function () { fim(); };
      rq.onblocked = function () { fim(); };
      setTimeout(fim, 1500);
    } catch (e) { fim(); }
  }
  function idbPut(k, v) {
    if (!idb) return;
    try { idb.transaction('kv', 'readwrite').objectStore('kv').put(v, k); } catch (e) { }
  }
  function idbGet(k, cb) {
    if (!idb) { cb(null); return; }
    try {
      var rq = idb.transaction('kv', 'readonly').objectStore('kv').get(k);
      rq.onsuccess = function () { cb(rq.result || null); };
      rq.onerror = function () { cb(null); };
    } catch (e) { cb(null); }
  }
  function hora() { var d = new Date(); return dois(d.getHours()) + ':' + dois(d.getMinutes()); }
  function statusSalvo(ok, quando) {
    var s = $('status');
    if (ok) { s.className = 'status'; s.textContent = '💾 ' + (quando ? 'Salvo às ' + hora() : 'Os dados ficam guardados neste aparelho'); }
    else { s.className = 'status bad'; s.textContent = '⚠️ Este navegador NÃO está guardando os dados. Abra pelo Chrome (ou pelo app instalado) e faça backup agora.'; }
  }
  function testeArmazenamento() {
    var ok = false;
    try { localStorage.setItem('__t', '1'); ok = localStorage.getItem('__t') === '1'; localStorage.removeItem('__t'); } catch (e) { }
    statusSalvo(ok || !!idb, false);
    try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) { }
  }
  /* devolve true se o localStorage já tinha dados guardados */
  function carregar() {
    var tinha = false;
    try {
      var t = localStorage.getItem(KEY);
      if (t !== null) { tinha = true; dados = (JSON.parse(t) || []).map(normaliza); }
    } catch (e) { dados = []; }
    return tinha;
  }
  function salvar() {
    var txt = JSON.stringify(dados), okLS = false;
    try { localStorage.setItem(KEY, txt); okLS = (localStorage.getItem(KEY) === txt); } catch (e) { }
    idbPut(KEY, txt);
    var ok = okLS || !!idb;
    statusSalvo(ok, true);
    if (!ok) aviso('Não foi possível salvar neste navegador. Faça backup agora.');
    return ok;
  }

  /* ---------- foto do perfil ---------- */
  function aplicarFoto() {
    var f = null;
    try { f = localStorage.getItem(FOTO); } catch (e) { }
    var b = $('foto');
    if (f) { b.style.backgroundImage = 'url(' + f + ')'; b.textContent = ''; }
    else { b.style.backgroundImage = 'none'; b.textContent = '👤'; }
  }
  $('foto').addEventListener('click', function () { $('fotoArq').click(); });
  $('fotoArq').addEventListener('change', function (e) {
    var f = e.target.files[0];
    e.target.value = '';
    if (!f) return;
    var rd = new FileReader();
    rd.onload = function () {
      var im = new Image();
      im.onload = function () {
        var s = Math.min(im.width, im.height), c = document.createElement('canvas');
        c.width = c.height = 160;
        c.getContext('2d').drawImage(im, (im.width - s) / 2, (im.height - s) / 2, s, s, 0, 0, 160, 160);
        var u = c.toDataURL('image/jpeg', 0.8);
        try { localStorage.setItem(FOTO, u); } catch (err) { aviso('Não deu para guardar a foto.'); return; }
        aplicarFoto();
        aviso('Foto atualizada.', true);
      };
      im.onerror = function () { aviso('Não consegui abrir essa imagem.'); };
      im.src = rd.result;
    };
    rd.readAsDataURL(f);
  });

  /* ---------- datas ---------- */
  function hoje() {
    var d = new Date();
    return d.getFullYear() + '-' + dois(d.getMonth() + 1) + '-' + dois(d.getDate());
  }
  function fmtData(iso) {
    if (!iso) return '—';
    var p = iso.split('-');
    return p[2] + '/' + p[1] + '/' + p[0];
  }
  function fmtCurto(iso) {
    var p = iso.split('-');
    return p[2] + '/' + p[1];
  }
  function seletorData(p, iso) {
    var q = iso.split('-'), a = q[0], m = q[1], d = q[2];
    var ano = new Date().getFullYear();
    var od = '', om = '', oa = '', i, v, y;
    for (i = 1; i <= 31; i++) { v = dois(i); od += '<option value="' + v + '"' + (v === d ? ' selected' : '') + '>' + i + '</option>'; }
    for (i = 0; i < 12; i++) { v = dois(i + 1); om += '<option value="' + v + '"' + (v === m ? ' selected' : '') + '>' + MESES[i] + '</option>'; }
    for (y = ano - 3; y <= ano + 8; y++) { oa += '<option value="' + y + '"' + (String(y) === a ? ' selected' : '') + '>' + y + '</option>'; }
    return '<select id="' + p + 'D" aria-label="Dia">' + od + '</select>' +
      '<select id="' + p + 'M" aria-label="Mês">' + om + '</select>' +
      '<select id="' + p + 'A" aria-label="Ano">' + oa + '</select>';
  }
  function lerData(p) {
    var y = $(p + 'A').value, m = $(p + 'M').value;
    var max = new Date(Number(y), Number(m), 0).getDate();
    var d = Math.min(parseInt($(p + 'D').value, 10), max);
    return y + '-' + m + '-' + dois(d);
  }
  function seletorMes(idM, idA, ym) {
    var q = ym.split('-'), a = q[0], m = q[1];
    var ano = new Date().getFullYear();
    var om = '', oa = '', i, v, y;
    for (i = 0; i < 12; i++) { v = dois(i + 1); om += '<option value="' + v + '"' + (v === m ? ' selected' : '') + '>' + MESES[i] + '</option>'; }
    for (y = ano - 2; y <= ano + 8; y++) { oa += '<option value="' + y + '"' + (String(y) === a ? ' selected' : '') + '>' + y + '</option>'; }
    return '<select id="' + idM + '" aria-label="Mês">' + om + '</select>' +
      '<select id="' + idA + '" aria-label="Ano">' + oa + '</select>';
  }
  function lerMes(idM, idA) { return $(idA).value + '-' + $(idM).value; }
  function iniciarSeletor() {
    $('mesBox').innerHTML = seletorMes('mesM', 'mesA', hoje().slice(0, 7));
    $('compraBox').innerHTML = seletorData('cp', hoje());
  }

  /* ---------- formulário: lista de produtos ---------- */
  function linhaHtml() {
    return '<div class="linha"><input class="in-nome" placeholder="Produto (ex.: Perfume)" autocomplete="off">' +
      '<input class="in-valor" type="text" inputmode="decimal" autocomplete="off" placeholder="R$">' +
      '<button type="button" class="x" aria-label="Remover produto">✕</button></div>';
  }
  function iniciarLinhas() { $('itensForm').innerHTML = linhaHtml(); }
  function lerLinhas() {
    var rows = $('itensForm').querySelectorAll('.linha');
    var itens = [], erro = '';
    for (var i = 0; i < rows.length; i++) {
      var nome = rows[i].querySelector('.in-nome').value.trim();
      var vs = rows[i].querySelector('.in-valor').value;
      if (!nome && !vs.trim()) continue;
      var v = num(vs);
      if (!nome) { erro = 'Digite o nome do produto da linha ' + (i + 1) + '.'; break; }
      if (isNaN(v)) { erro = 'Digite o valor do produto "' + nome + '".'; break; }
      itens.push({ nome: nome, valor: Math.round(v * 100) / 100 });
    }
    return { itens: itens, erro: erro };
  }
  function previa() {
    var r = lerLinhas();
    var n = parseInt($('vezes').value, 10);
    if (!r.itens.length) { $('previa').textContent = 'Adicione os produtos para ver a soma.'; return; }
    var t = somaItens(r.itens);
    $('previa').textContent = 'Soma dos produtos: ' + brl(t) + (n ? ' · em ' + n + 'x de ' + brl(t / n) : '');
  }
  $('addLinha').addEventListener('click', function () {
    $('itensForm').insertAdjacentHTML('beforeend', linhaHtml());
    var ins = $('itensForm').querySelectorAll('.in-nome');
    ins[ins.length - 1].focus();
  });
  $('itensForm').addEventListener('input', previa);
  $('itensForm').addEventListener('click', function (e) {
    var t = e.target;
    if (t.className !== 'x') return;
    var rows = $('itensForm').querySelectorAll('.linha');
    var row = t.parentNode;
    if (rows.length > 1) { row.parentNode.removeChild(row); }
    else { row.querySelector('.in-nome').value = ''; row.querySelector('.in-valor').value = ''; }
    previa();
  });
  $('vezes').addEventListener('input', previa);

  $('f').addEventListener('submit', function (e) {
    e.preventDefault();
    var r = lerLinhas();
    if (r.erro) { aviso(r.erro); return; }

    var vz = parseInt($('vezes').value, 10);
    if (!vz || vz < 1 || vz > 60) { aviso('Informe de 1 a 60 parcelas.'); return; }
    dados.unshift({
      id: Date.now(),
      nome: $('nome').value.trim(),
      itens: r.itens,
      vezes: vz,
      mes: lerMes('mesM', 'mesA'),
      compra: lerData('cp'),
      pagtos: {}
    });
    salvar();
    e.target.reset();
    $('vezes').value = 1;
    iniciarLinhas();
    iniciarSeletor();
    previa();
    render();
    aviso('Cliente salvo.', true);
  });

  /* ---------- produtos de um cliente já cadastrado ---------- */
  function addItem(id) {
    var c = achar(id);
    var n = $('an' + id).value.trim();
    var v = num($('av' + id).value);
    if (!n) { aviso('Digite o nome do produto.'); return; }
    if (isNaN(v)) { aviso('Digite o valor do produto.'); return; }
    c.itens.push({ nome: n, valor: Math.round(v * 100) / 100 });
    salvar(); render();
    aviso('Produto adicionado.', true);
  }
  function delItem(id, ix) {
    var c = achar(id);
    if (c.itens.length <= 1) { aviso('O cliente precisa ter pelo menos 1 produto.'); return; }
    c.itens.splice(ix, 1);
    ed = null;
    salvar(); render();
  }

  /* ---------- ações dos cartões ---------- */
  function maisMes(id) {
    var c = achar(id);
    if (c.vezes >= 60) { aviso('Máximo de 60 parcelas.'); return; }
    c.vezes++; salvar(); render();
  }
  function menosMes(id) {
    var c = achar(id);
    if (c.vezes <= 1) { aviso('O cliente precisa ter pelo menos 1 parcela.'); return; }
    if (pagos(c, c.vezes - 1).length) { aviso('A última parcela tem pagamento. Toque nela e remova o pagamento antes de tirar o mês.'); return; }
    c.vezes--;
    if (pg && pg.id === id && pg.i >= c.vezes) pg = null;
    salvar(); render();
  }
  function excluir(id) {
    if (!confirm('Excluir este cliente?')) return;
    dados = dados.filter(function (x) { return x.id !== id; });
    salvar(); render();
  }
  function editar(id, key, idx) {
    pg = null; ed = { id: id, key: key, idx: idx || 0 };
    render();
    var el = $('edIn') || $('edM') || $('edcD');
    if (el) { el.focus(); if (el.select && el.type !== 'select-one') el.select(); }
  }
  function cancelar() { ed = null; render(); }
  function confirmar() {
    if (!ed) return;
    var c = achar(ed.id);
    var k = ed.key;
    var n;
    if (k === 'mes') {
      c.mes = lerMes('edM', 'edA');
    } else if (k === 'compra') {
      c.compra = lerData('edc');
    } else {
      var v = $('edIn').value.trim();
      if (k === 'nome') {
        if (!v) { aviso('Preencha o campo.'); return; }
        c.nome = v;
      } else if (k === 'iNome') {
        if (!v) { aviso('Preencha o nome do produto.'); return; }
        c.itens[ed.idx].nome = v;
      } else if (k === 'iValor') {
        n = num(v);
        if (isNaN(n)) { aviso('Informe um valor válido.'); return; }
        c.itens[ed.idx].valor = Math.round(n * 100) / 100;
      } else if (k === 'vezes') {
        n = parseInt(v, 10);
        var min = 1;
        for (var q = 0; q < c.vezes; q++) { if (pagos(c, q).length) min = q + 1; }
        if (!n || n < min || n > 60) { aviso('Informe de ' + min + ' a 60 parcelas.'); return; }
        c.vezes = n;
      }
    }
    ed = null; salvar(); render();
  }

  /* ---------- pagamento de cada parcela (toque no mês: valor pago + dia) ---------- */
  function focarPag() {
    var el = $('pgIn');
    if (el) { el.focus(); el.select(); }
  }
  function abrirPag(id, i, k) {
    ed = null; pg = { id: id, i: i, k: (k === undefined ? -1 : k) };
    render();
    focarPag();
  }
  function corrigirPag(k) {
    if (!pg) return;
    pg.k = k;
    render();
    focarPag();
  }
  function cancelarPag() { pg = null; render(); }
  function salvarPag() {
    if (!pg) { aviso('Toque no mês de novo e tente salvar.'); return; }
    var c = achar(pg.id);
    var campoIn = $('pgIn');
    if (!c || !campoIn) { aviso('Toque no mês de novo e tente salvar.'); return; }
    var v = num(campoIn.value);
    if (isNaN(v) || v <= 0) { aviso('Digite o valor pago (ex.: 63,33).'); return; }
    v = r2(v);
    var i = pg.i;
    var lista = pagos(c, i).slice();
    var novo = { v: v, d: lerData('pgd') };
    if (pg.k >= 0 && lista[pg.k]) { lista[pg.k] = novo; } else { lista.push(novo); }
    lista.sort(function (a, b) { return a.d < b.d ? -1 : (a.d > b.d ? 1 : 0); });
    c.pagtos[i] = lista;
    pg = null;
    salvar(); render();
    aviso((i + 1) + 'ª parcela: pagamento de ' + brl(v) + ' salvo', true);
  }
  function removerPag(k) {
    if (!pg) return;
    var c = achar(pg.id), i = pg.i;
    var lista = pagos(c, i).slice();
    if (!lista[k]) return;
    if (!confirm('Remover este pagamento?')) return;
    lista.splice(k, 1);
    if (lista.length) { c.pagtos[i] = lista; } else { delete c.pagtos[i]; }
    pg.k = -1;
    salvar(); render();
  }

  window.abrirPag = abrirPag; window.cancelarPag = cancelarPag;
  window.salvarPag = salvarPag; window.corrigirPag = corrigirPag; window.removerPag = removerPag;
  window.maisMes = maisMes; window.menosMes = menosMes;
  window.editar = editar; window.cancelar = cancelar; window.confirmar = confirmar;
  window.excluir = excluir;
  window.addItem = addItem; window.delItem = delItem;

  /* ---------- campo com lápis ---------- */
  var TIPOS = {
    nome: { t: 'text' }, iNome: { t: 'text' },
    iValor: { t: 'text', extra: 'inputmode="decimal" autocomplete="off"' },
    vezes: { t: 'number', extra: 'step="1" inputmode="numeric"' }
  };
  var BTNS = '<button type="button" class="pri" onclick="confirmar()" aria-label="Salvar">✔</button>' +
    '<button type="button" onclick="cancelar()" aria-label="Cancelar">✕</button>';
  function valorCampo(c, k, idx) {
    if (k === 'iNome') return c.itens[idx].nome;
    if (k === 'iValor') return fnum(c.itens[idx].valor);
    return c[k];
  }
  function campo(c, k, texto, idx) {
    idx = idx || 0;
    if (ed && ed.id === c.id && ed.key === k && ed.idx === idx) {
      if (k === 'mes') return '<span class="ed">' + seletorMes('edM', 'edA', c.mes) + BTNS + '</span>';
      if (k === 'compra') return '<span class="ed">' + seletorData('edc', c.compra || hoje()) + BTNS + '</span>';
      var tp = TIPOS[k];
      return '<span class="ed"><input id="edIn" type="' + tp.t + '" ' + (tp.extra || '') +
        ' value="' + esc(valorCampo(c, k, idx)) + '" onkeydown="if(event.key===\'Enter\'){confirmar()}if(event.key===\'Escape\'){cancelar()}">' + BTNS + '</span>';
    }
    return texto + '<button type="button" class="lap" onclick="editar(' + c.id + ',\'' + k + '\',' + idx + ')" aria-label="Editar">✏️</button>';
  }

  function painelPag(c) {
    var i = pg.i, r = calc(c), lst = pagos(c, i), soma = somaPag(c, i);
    var editando = pg.k >= 0 && !!lst[pg.k];
    var atual, dia;
    if (editando) { atual = lst[pg.k].v; dia = lst[pg.k].d; }
    else {
      dia = hoje();
      if (lst.length) { atual = r2(r.parcela - soma); }
      else { atual = (r.faltam === 1 ? r.pendente : r2(r.parcela)); }
      if (!(atual > 0)) atual = '';
    }
    var h = '<div class="pag"><b>' + (editando ? 'Corrigir pagamento' : 'Novo pagamento') + ' · ' + (i + 1) + 'ª parcela · ' + rotuloMes(c.mes, i) + '</b>';
    if (lst.length) {
      lst.forEach(function (p, k) {
        h += '<div class="pgrow"><span class="ok">' + (k + 1) + 'º · ' + brl(p.v) + ' · ' + fmtCurto(p.d) + '</span>' +
          '<span><button type="button" class="lap" onclick="corrigirPag(' + k + ')" aria-label="Corrigir pagamento">✏️</button>' +
          '<button type="button" class="lap" onclick="removerPag(' + k + ')" aria-label="Remover pagamento">🗑️</button></span></div>';
      });
      if (lst.length > 1) h += '<div class="p0 no">Total do mês: ' + brl(soma) + '</div>';
    }
    h += '<label>Valor pago (R$)' +
      '<input id="pgIn" type="text" inputmode="decimal" autocomplete="off" value="' + fnum(atual) + '" ' +
      'onkeydown="if(event.key===\'Enter\'){salvarPag()}"></label>' +
      '<label>Dia do pagamento<span class="par data">' + seletorData('pgd', dia) + '</span></label>' +

  function blocoCalc(c, r) {
    var quitado = r.pendente <= 0.004;

    return '<div class="calc"><h3>Cálculo automático</h3>' +
      '<div class="l"><span>Bruto (soma de ' + np + ' produto' + (np > 1 ? 's' : '') + ')</span><b>' + brl(r.total) + '</b></div>' +

  function blocoProdutos(c, r) {

      '<input id="av' + c.id + '" type="text" inputmode="decimal" autocomplete="off" placeholder="R$">' +

  function blocoPagos(c, r) {
    var h = '<div class="plabel">Pagamentos (' + r.pagas + ' de ' + c.vezes + ')</div>';
    var falta = [], i;

    for (i = 0; i < c.vezes; i++) {
      if (pagos(c, i).length) {

  function render() {
    var q = $('busca').value.toLowerCase().trim();
    var lista = dados.filter(function (c) {
      if (!q) return true;
      if (tem(c.nome.toLowerCase(), q)) return true;
      for (var i = 0; i < c.itens.length; i++) { if (tem(c.itens[i].nome.toLowerCase(), q)) return true; }
      return false;

  /* ---------- backup ---------- */
  function abrirBk(msg, txt) {
    $('bkBox').hidden = false;

    $('bkBox').scrollIntoView();
  }
  function aplicarBk(txt) {
    try {
      var j = JSON.parse(txt);
      if (!Array.isArray(j)) throw 0;
      if (!confirm('Substituir os dados atuais pelo backup?')) return;
      dados = j.map(normaliza);
      salvar(); render();
      $('bkBox').hidden = true;
    } catch (err) {
      aviso('Backup inválido. Cole o texto completo do backup e tente de novo.');
    }
  }
  $('btnBackup').addEventListener('click', function () {
    var txt = JSON.stringify(dados, null, 2);
    abrirBk('Backup pronto. Toque em "Copiar texto" e guarde em um lugar seguro (notas, WhatsApp, e-mail).', txt);
    try {
      var blob = new Blob([txt], { type: 'application/json' });
      var a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'backup-clientes-' + hoje() + '.json';
      document.body.appendChild(a); a.click(); a.remove();
    } catch (e) { }
  });
  $('btnRestaurar').addEventListener('click', function () {
    abrirBk('Cole aqui o texto do backup e toque em "Restaurar deste texto", ou abra o arquivo .json.', '');
    $('bkTxt').focus();
  });
  $('bkCopiar').addEventListener('click', function () {
    var t = $('bkTxt');
    t.focus(); t.select();
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) { navigator.clipboard.writeText(t.value); }
      else { document.execCommand('copy'); }
      aviso('Texto copiado.', true);
    } catch (e) { aviso('Selecione o texto e copie manualmente.'); }
  });
  $('bkRest').addEventListener('click', function () { aplicarBk($('bkTxt').value); });
  $('bkFechar').addEventListener('click', function () { $('bkBox').hidden = true; });
  $('bkArqBtn').addEventListener('click', function () { $('arq').click(); });
  $('arq').addEventListener('change', function (e) {
    var f = e.target.files[0];
    if (!f) return;
    var rd = new FileReader();
    rd.onload = function () { aplicarBk(rd.result); };
    rd.readAsText(f);
    e.target.value = '';
  });

  /* ---------- instalar como aplicativo ---------- */
  var evInstalar = null;
  window.addEventListener('beforeinstallprompt', function (e) {
    e.preventDefault();
    evInstalar = e;
    $('btnInstalar').hidden = false;
  });
  window.addEventListener('appinstalled', function () { $('btnInstalar').hidden = true; evInstalar = null; });
  $('btnInstalar').addEventListener('click', function () {
    if (!evInstalar) return;
    evInstalar.prompt();
    evInstalar.userChoice.then(function () { evInstalar = null; $('btnInstalar').hidden = true; });
  });
  if ('serviceWorker' in navigator && /^https?:/.test(location.protocol)) {
    window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () { }); });
  }

  iniciarLinhas();
  iniciarSeletor();
  var tinha = carregar();
  render();
  aplicarFoto();
  window.__ok = true;
  abrirIDB(function () {
    if (!tinha) {
      /* o localStorage veio vazio ou bloqueado: tenta recuperar a cópia do IndexedDB */
      idbGet(KEY, function (t) {
        if (t) {
          try { dados = JSON.parse(t).map(normaliza); render(); } catch (e) { }
        }
        testeArmazenamento();
      });
    } else {
      idbPut(KEY, JSON.stringify(dados));
      testeArmazenamento();
    }
  });
})();
</script>
</body>
</html>
